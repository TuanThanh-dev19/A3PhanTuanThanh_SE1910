spring.application.name=A3PhanTuanThanh_SE1910
spring.config.import=optional:file:./application-local.properties
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=A3PhanTuanThanh_SE1910;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never

app.staff.email=${STAFF_EMAIL}
app.staff.password=${STAFF_PASSWORD}
app.jwt.secret=${JWT_SECRET}
